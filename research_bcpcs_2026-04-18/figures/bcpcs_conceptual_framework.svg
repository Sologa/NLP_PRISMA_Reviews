<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">BCPCS conceptual framework</title>
  <desc id="desc">A flow diagram from source faithful criteria through typed eligibility graph, support and refute retrieval, evidence ledger, boundary atlas, selective routing, and final audited decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .box { fill: #f7f9fb; stroke: #333333; stroke-width: 2; rx: 8; }
      .risk { fill: #fff4e6; stroke: #7a4b00; stroke-width: 2; rx: 8; }
      .out { fill: #eef7ee; stroke: #2f5f31; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333333; }
      .arrow { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="30" y="55" width="165" height="95" class="box"/>
  <text x="112" y="92" text-anchor="middle" class="text">Source-faithful</text>
  <text x="112" y="116" text-anchor="middle" class="text">stage criteria</text>
  <text x="112" y="138" text-anchor="middle" class="small">no rewriting</text>

  <rect x="245" y="55" width="165" height="95" class="box"/>
  <text x="327" y="91" text-anchor="middle" class="text">Typed eligibility</text>
  <text x="327" y="116" text-anchor="middle" class="text">graph</text>
  <text x="327" y="138" text-anchor="middle" class="small">atomic claims</text>

  <rect x="460" y="35" width="180" height="70" class="box"/>
  <text x="550" y="64" text-anchor="middle" class="text">Support</text>
  <text x="550" y="88" text-anchor="middle" class="text">retrieval</text>

  <rect x="460" y="130" width="180" height="70" class="risk"/>
  <text x="550" y="159" text-anchor="middle" class="text">Refutation</text>
  <text x="550" y="183" text-anchor="middle" class="text">retrieval</text>

  <rect x="690" y="55" width="170" height="95" class="box"/>
  <text x="775" y="91" text-anchor="middle" class="text">Evidence ledger</text>
  <text x="775" y="116" text-anchor="middle" class="small">quote, location,</text>
  <text x="775" y="136" text-anchor="middle" class="small">support/refute/unknown</text>

  <rect x="910" y="55" width="170" height="95" class="out"/>
  <text x="995" y="91" text-anchor="middle" class="text">Graph-derived</text>
  <text x="995" y="116" text-anchor="middle" class="text">decision</text>
  <text x="995" y="138" text-anchor="middle" class="small">auditable verdict</text>

  <rect x="460" y="280" width="180" height="95" class="risk"/>
  <text x="550" y="315" text-anchor="middle" class="text">Boundary atlas</text>
  <text x="550" y="339" text-anchor="middle" class="small">positive and hard</text>
  <text x="550" y="359" text-anchor="middle" class="small">negative contrasts</text>

  <rect x="690" y="280" width="170" height="95" class="risk"/>
  <text x="775" y="315" text-anchor="middle" class="text">Selective routing</text>
  <text x="775" y="339" text-anchor="middle" class="small">risk, abstention,</text>
  <text x="775" y="359" text-anchor="middle" class="small">SeniorLead/human</text>

  <rect x="910" y="280" width="170" height="95" class="out"/>
  <text x="995" y="315" text-anchor="middle" class="text">Reports</text>
  <text x="995" y="339" text-anchor="middle" class="small">auto/selective/</text>
  <text x="995" y="359" text-anchor="middle" class="small">assisted metrics</text>

  <path d="M 195 102 L 245 102" class="arrow"/>
  <path d="M 410 102 L 460 70" class="arrow"/>
  <path d="M 410 102 L 460 165" class="arrow"/>
  <path d="M 640 70 L 690 102" class="arrow"/>
  <path d="M 640 165 L 690 102" class="arrow"/>
  <path d="M 860 102 L 910 102" class="arrow"/>
  <path d="M 550 280 L 550 200" class="arrow"/>
  <path d="M 775 150 L 775 280" class="arrow"/>
  <path d="M 860 327 L 910 327" class="arrow"/>
  <path d="M 995 150 L 995 280" class="arrow"/>
  <text x="560" y="428" text-anchor="middle" class="small">All generated artifacts stay inside research_bcpcs_2026-04-18/.</text>
</svg>
